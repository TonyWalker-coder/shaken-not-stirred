<!DOCTYPE html>
{% load static %}


<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="Browse illustrated cocktail recipes with ingredients, history, and preparation steps.">
  <title>Shaken!Stirred – Cocktail Recipes</title>

  <link rel="stylesheet" href="{% static 'cocktails/styles.css' %}">
  <link rel="stylesheet" href="{% static 'cocktails/header.css' %}">
  <link rel="stylesheet" href="{% static 'cocktails/cocktailgrid.css' %}">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Henny+Penny&family=Englebert&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Site Header -->
  <header class="hero">
    <h1 class="title title-overlay"><a href="/">Shaken!Stirred</a></h1>
    <nav class="title-homepage title-overlay"><a href="/">Home</a></nav>
  </header>


  <!-- Cocktail Grid -->
  <section class="cocktail-grid" aria-label="Cocktail list">
    {% for cocktail in cocktails %}
    <div class="cocktail-card" tabindex="0" aria-label="View details for {{ cocktail.name }}"
      data-name="{{ cocktail.name }}" data-ingredients="{% for ing in cocktail.ingredients.all %}
          {{ ing.name }}{% if not forloop.last %}, {% endif %}
        {% endfor %}" data-recipe="{{ cocktail.recipe_obj.text }}" data-history="{{ cocktail.history_obj.text }}"
      data-image="{{ cocktail.image_url }}">



      <img class="cocktail-image" src="{% if cocktail.image_url %}
             {% static cocktail.image_url %}
          {% else %}
             {% static 'cocktails/buttons/no-image.png' %}
          {% endif %}" alt="{{ cocktail.name }}" onerror="this.src='{% static 'cocktails/buttons/no-image.png' %}'">

      <h2>{{ cocktail.name }}</h2>
    </div>
    {% endfor %}
  </section>

  <!-- Modal -->
  <div id="cocktail-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-name">

    <div class="modal-content">
      <span class="close" role="button" aria-label="Close modal" tabindex="0">&times;</span>


      <img id="modal-image" class="modal-image" src="{% static 'cocktails/buttons/no-image.png' %}" alt=""
        onerror="this.src='{% static 'cocktails/buttons/no-image.png' %}'">

      <h2 id="modal-name" aria-live="polite"></h2>

      <h3>Ingredients</h3>
      <ul id="modal-ingredients"></ul>

      <h3>Recipe</h3>
      <p id="modal-recipe"></p>

      <h3>History</h3>
      <p id="modal-history"></p>
    </div>
  </div>


    <script>
      document.querySelectorAll('.cocktail-card').forEach((card) => {
        card.addEventListener('click', () => {
          // Name
          document.getElementById('modal-name').textContent = card.dataset.name

          // Ingredients (split into list items)
          const ingredients = card.dataset.ingredients.split(', ')
          const ul = document.getElementById('modal-ingredients')
          ul.innerHTML = ''
          ingredients.forEach((ing) => {
            const li = document.createElement('li')
            li.textContent = ing
            ul.appendChild(li)
          })

          // Recipe + History
          document.getElementById('modal-recipe').textContent = card.dataset.recipe
          document.getElementById('modal-history').textContent = card.dataset.history

          // Image
          const modalImg = document.getElementById('modal-image');

          if (card.dataset.image) {
            modalImg.src = `{% static '' %}${card.dataset.image}`;
          } else {
            modalImg.src = `{% static 'cocktails/buttons/no-image.png' %}`;
          }

          // Set alt text dynamically
          modalImg.alt = `${card.dataset.name} image`;

          // Show modal
          document.getElementById('cocktail-modal').classList.remove('hidden')
        })
        // Keyboard accessibility handler
        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            card.click();
          }
        });
      })

      // Close modal
      document.querySelector('.close').addEventListener('click', () => {
        document.getElementById('cocktail-modal').classList.add('hidden')
      })

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          document.getElementById('cocktail-modal').classList.add('hidden')
        }
      })

      document.getElementById('cocktail-modal').addEventListener('click', (e) => {
        if (e.target.id === 'cocktail-modal') {
          e.target.classList.add('hidden')
        }
      })

    </script>
  </body>
</html>
