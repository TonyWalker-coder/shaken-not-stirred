<!DOCTYPE html>
{% load static %}
<html>

<head>
    <style>

        img {
            width: 100%;
            border-radius: 14px;
        }

        .card {
            background: rgba(255, 255, 255, 0.18);
            padding: 2rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            color: white;
            max-width: 420px;
            margin: auto;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        .card img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.25);
            padding: 10px;
            margin-bottom: 1rem;
        }

        .card h2 {
            font-family: 'Henny Penny', cursive;
            color: #f77c24;
            margin-bottom: 1rem;
        }

        .card p {
            font-size: 1.1rem;
            line-height: 1.5rem;
        }

        .card ul {
            list-style: none;
            padding: 0;
            margin-bottom: 1rem;
        }

        .card ul li {
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 10px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .ingredients-list {
            list-style: none;
            padding: 0;
            margin: 1rem 0;
        }

        .ingredients-list li {
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 6px;
            color: white;
            font-size: 1rem;
        }

        .card h3 {
            color: #f77c24;
            font-family: 'Henny Penny', cursive;
            margin-top: 1.5rem;
        }


        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="{% if cocktail.image_url %}
                 {% static cocktail.image_url %}
              {% else %}
                 {% static 'cocktails/buttons/no-image.png' %}
              {% endif %}">

        <h2>{{ cocktail.name }}</h2>

        <h3>Ingredients</h3>
        <ul>
            {% for ing in cocktail.ingredients.all %}
            <li>{{ ing.name }}</li>
            {% endfor %}
        </ul>

        <h3>Recipe</h3>
        <p>{{ cocktail.recipe_obj.text }}</p>

        <h3>History</h3>
        <p>{{ cocktail.history_obj.text }}</p>
    </div>

</body>

</html>
