{% load static %}
<link rel="stylesheet" href="{% static 'cocktails/styles.css' %}">
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Henny+Penny&family=Englebert&display=swap" rel="stylesheet">

<body class="admin-body">
    <div class="admin-wrapper">
        <div class="hero">
            <h1 class="title"><a href="/">Shaken!Stirred</a></h1>
        </div>
        <div class="admin-grid">
            <div class="admin-card" onclick="openIngredientsModal()">
                <img src="{% static 'cocktails/buttons/ingredients.png' %}" alt="Ingredients">
            </div>

            <div class="admin-card">
                <img src="{% static 'cocktails/buttons/images.png' %}" alt="Images">
            </div>

            <div class="admin-card">
                <img src="{% static 'cocktails/buttons/history.png' %}" alt="History">
            </div>

            <div class="admin-card">
                <img src="{% static 'cocktails/buttons/recipes.png' %}" alt="Recipes">
            </div>

            <div class="admin-card">
                <img src="{% static 'cocktails/buttons/add.png' %}" alt="Add">
            </div>

            <div class="admin-card">
                <img src="{% static 'cocktails/buttons/list.png' %}" alt="List">
            </div>


        </div>

        <!-- INGREDIENTS MODAL -->
        <div id="ingredientsModal" class="modal hidden">
            <div class="modal-content">

                <span class="close" onclick="closeIngredientsModal()">&times;</span>

                <!-- Your button artwork at the top -->
                <img src="{% static 'cocktails/buttons/ingredients.png' %}" alt="Ingredients" class="modal-image">

                <h2>Ingredients</h2>

                <!-- Ingredient list -->
                <div class="ingredient-list">
                    {% for ingredient in ingredients %}
                    <div class="ingredient-item">
                        <span>{{ ingredient.name }}</span>

                        <!--
VS Code may show a JavaScript syntax warning here.
This is NOT an error — it happens because Django template tags
are embedded inside an onclick="" attribute. The browser handles
this correctly, and the modal works as intended.
-->
                        <div class="ingredient-actions">
                            <a href="#" class="edit-btn"
                                onclick="openEditIngredientModal({{ ingredient.id }}, &quot;{{ ingredient.name|escapejs }}&quot;)">Edit</a>

                            <a href="{% url 'delete_ingredient' ingredient.id %}" class="delete-btn">Delete</a>
                        </div>

                    </div>
                    {% empty %}
                    <p>No ingredients yet.</p>
                    {% endfor %}
                </div>

                <h3>Add Ingredient</h3>
                <form method="POST" action="{% url 'add_ingredient' %}">
                    {% csrf_token %}
                    <input type="text" name="name" placeholder="Ingredient name" required>
                    <button type="submit" class="add-btn">Add</button>
                </form>

            </div>
        </div>

        <!-- EDIT INGREDIENT MODAL -->
        <div id="editIngredientModal" class="modal hidden">
            <div class="modal-content">

                <span class="close" onclick="closeEditIngredientModal()">&times;</span>

                <!-- Artwork at top (same as Ingredients) -->
                <img src="{% static 'cocktails/buttons/ingredients.png' %}" alt="Edit Ingredient" class="modal-image">

                <h2>Edit Ingredient</h2>

                <form method="POST" action="" id="editIngredientForm">
                    {% csrf_token %}
                    <input type="text" name="name" id="editIngredientName" required>
                    <button type="submit" class="add-btn">Save</button>
                </form>

            </div>
        </div>




    </div>
</body>

<script>
    function openIngredientsModal() {
        document.getElementById("ingredientsModal").classList.remove("hidden");
    }

    function closeIngredientsModal() {
        document.getElementById("ingredientsModal").classList.add("hidden");
    }

    function openEditIngredientModal(id, name) {
        // Fill the input with the current name
        document.getElementById("editIngredientName").value = name;

        // Set the form action dynamically
        document.getElementById("editIngredientForm").action = `/ingredient/edit/${id}/`;

        // Show modal
        document.getElementById("editIngredientModal").classList.remove("hidden");
    }

    function closeEditIngredientModal() {
        document.getElementById("editIngredientModal").classList.add("hidden");
    }
</script>
