<!DOCTYPE html>
<!-- Page complete – Tony, 2/09/2026 iframe ingredients lookup -->
{% load static %}
<html lang="en">

<head>

<style>

    /* ============================================
       DROPDOWN FILTER
       Used to select an ingredient category
       ============================================ */
    .dropdown {
        padding: 0.6rem;
        border-radius: 10px;
        font-size: 1.1rem;
    }

    /* ============================================
       COCKTAIL GRID
       Responsive grid layout for lookup results
       ============================================ */
    .cocktail-grid {
        margin-top: 1.5rem;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 1.5rem; /* spacing between cards */
    }

    /* ============================================
       COCKTAIL CARD
       Frosted‑glass tile with hover animation
       ============================================ */
    .cocktail-card {
        background: rgba(255, 255, 255, 0.18);
        padding: 1rem;
        border-radius: 14px;
        text-align: center;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px); /* Safari support */
        cursor: pointer;
        transition: transform 0.15s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* Fade‑in animation for each card */
    .cocktail-card {
        opacity: 0;
        transform: translateY(10px);
        animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Hover lift effect */
    .cocktail-card:hover {
        transform: scale(1.05);
    }

    /* Glow on hover */
    .cocktail-card:hover {
        box-shadow: 0 0 12px rgba(247, 124, 36, 0.6);
    }

    /* Cocktail image inside card */
    .cocktail-card img {
        width: 120px;
        height: 120px;
        object-fit: contain; 
        margin-bottom: 0.5rem;
    }

    /* Image frame styling */
    .cocktail-card img {
        border-radius: 10px;
        background: rgba(255,255,255,0.25);
        padding: 6px;
    }

    /* Cocktail name text */
    .cocktail-name {
        color: #f77c24;
        font-family: 'Henny Penny', cursive;
        margin-top: 0.5rem;
        font-size: 1.1rem;
    }

    /* Form labels */
    label {
        color: white;
    }

    /* Section headings */
    h3 {
        color: white;
    }

</style>

</head>

<body>

    <h3>Select an Ingredient</h3>
    <!-- 
    DO NOT AUTO FORMAT this must stay 
    <option value="{{ ing.id }}" {% if ing.id == selected_id %}selected{% endif %}>
    -->
    <form method="GET">
    <label for="ingredient-select" >Select an Ingredient</label>

    <select id="ingredient-select" name="ingredient" class="dropdown" onchange="this.form.submit()">
        <option value="">-- Choose Ingredient --</option>
        {% for ing in ingredients %}
        <option value="{{ ing.id }}" {% if ing.id == selected_id %}selected{% endif %}>
            {{ ing.name }}
        </option>
        {% endfor %}
    </select>
    </form>


    {% if cocktails %}
    <div class="cocktail-grid">
        {% for c in cocktails %}
        <div class="cocktail-card" onclick="openChildModal({{ c.id }})">
            <img 
    src="{% if c.image_url %}
            {% static c.image_url %}
         {% else %}
            {% static 'cocktails/buttons/no-image.png' %}
         {% endif %}"
    alt="{% if c.image_url %}{{ c.name }} image{% else %}No image available for {{ c.name }}{% endif %}">

            <h4 class="cocktail-name">{{ c.name }}</h4>
        </div>
    
        {% endfor %}
    </div>
    {% endif %}

    <script>
        function openChildModal(id) {
            window.parent.postMessage({ type: "openChild", id: id }, "*");
        }
    </script>

</body>

</html>
