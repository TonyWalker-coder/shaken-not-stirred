<!DOCTYPE html>
{% load static %}
<link rel="stylesheet" href="{% static 'cocktails/styles.css' %}">
<link rel="stylesheet" href="{% static 'cocktails/index.css' %}">
<link rel="stylesheet" href="{% static 'cocktails/header.css' %}">
<link rel="stylesheet" href="{% static 'cocktails/modal.css' %}">

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Shaken!Stirred – Tropical Cocktail Explorer</title>
    <meta name="description"
        content="Discover cocktails, ingredients, recipes, and tropical drink history with Shaken!Stirred — a vibrant mixology experience.">
    <meta name="keywords" content="cocktails, mixology, recipes, tropical drinks, ingredients, shaken stirred">
    <meta name="author" content="Tony Walker">

    <!-- Google Fonts -->
    <!--link href="https://fonts.googleapis.com/css2?family=Henny+Penny&family=Playwrite+GB&display=swap" rel="stylesheet"-->
    <link href="https://fonts.googleapis.com/css2?family=Henny+Penny&family=Englebert&display=swap" rel="stylesheet">

</head>

<body>
    <!-- Page Header -->
    <header class="hero">
        <h1 class="title sunset-overlay">Welcome to Shaken!Stirred</h1>
    </header>
    <div>


        <div class="tile-row">
            <a class="tile" id="cocktailTile" href="{% url 'cocktail_list' %}">
                <span class="tile-text">🍸 Cocktails</span>
                <span class="spinner">⏳</span>
            </a>


            <a id="adminLoginBtn" class="tile">
                <span class="tile-text">🛠️ Admin</span>
            </a>



            <a class="tile" href="{% url 'user_area' %}">
                <span class="tile-text">👤 User Area</span>
            </a>
        </div>

    </div>

    <!-- ADMIN LOGIN MODAL -->
    <div id="adminLoginModal" class="modal hidden">
        <div class="modal-content">

            <span class="close" id="adminLoginClose">&times;</span>

            <!-- Tropical admin artwork -->
            <img src="{% static 'cocktails/buttons/admin.png' %}" alt="Admin" class="modal-image">

            <h2 class="modal-title">Admin Access</h2>
            <p>Enter the admin password to continue.</p>

            <form method="POST" action="{% url 'admin_login' %}">
                {% csrf_token %}
                <input type="password" name="password" placeholder="Password" required autocomplete="current-password"
                    style="width:100%; padding:10px; border-radius:8px; border:1px solid #d46b00;">

                <button type="submit" class="add-btn" style="margin-top:12px;">
                    Enter
                </button>
            </form>

        </div>
    </div>



</body>
<script type="module" src="/static/js/admin/index.js"></script>

</html>
