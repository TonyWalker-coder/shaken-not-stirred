{% extends "admin.html" %}
{% block content %}

<div class="glass-panel">
    <a href="{% url 'admin_forum' %}" class="return-btn">⬅ Back to Forum Admin</a>

    <h1>{{ thread.title }}</h1>
    
    <p>{{ thread.body }}</p>

    <h2>Replies</h2>

    {% for reply in replies %}
        <div class="reply-card">
            <p>{{ reply.body }}</p>
            <small>By {{ reply.author.username }} — {{ reply.created_at }}</small>

            <a class="btn" href="{% url 'delete_reply' reply.id %}">Delete Reply</a>
        </div>
    {% empty %}
        <p>No replies yet.</p>
    {% endfor %}
</div>

{% endblock %}
